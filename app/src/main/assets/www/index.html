<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeron Vision Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Header & Tabs -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50 shadow-lg">
        <div class="max-w-xl mx-auto flex flex-col gap-3">
            <div class="flex justify-between items-center">
                <h1 class="text-xl font-bold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">
                    Jeron Studio 🚀
                </h1>
                <span id="modelIndicator" class="text-xs bg-purple-950 text-purple-300 border border-purple-800 px-3 py-1 rounded-full">Vision & Unfiltered</span>
            </div>
            
            <div class="flex gap-2 bg-slate-950 p-1 rounded-xl border border-slate-800">
                <button onclick="switchTab('roleplay')" id="tabRpBtn" 
                    class="flex-1 py-2 text-sm font-semibold rounded-lg bg-purple-600 text-white transition">
                    💬 الشات والتحليل
                </button>
                <button onclick="switchTab('image')" id="tabImgBtn" 
                    class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition">
                    🖼️ توليد الصور
                </button>
                <button onclick="switchTab('settings')" id="tabSettingsBtn" 
                    class="py-2 px-3 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition">
                    ⚙️
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-xl w-full mx-auto p-4 flex flex-col justify-between">
        
        <!-- ROLEPLAY & VISION SECTION -->
        <div id="roleplaySection" class="flex flex-col flex-grow gap-4">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 shadow-xl">
                <label class="text-xs font-semibold text-purple-400 block mb-1">توجيه الشخصية (System Prompt):</label>
                <textarea id="systemPrompt" rows="2" 
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-slate-100 focus:outline-none focus:border-purple-500 transition">You are an advanced multimodal AI companion capable of analyzing images, roleplaying, and unrestricted creative storytelling.</textarea>
            </div>

            <!-- Chat Box -->
            <div id="chatBox" class="bg-slate-900 border border-slate-800 rounded-2xl p-4 h-[320px] overflow-y-auto flex flex-col gap-3 shadow-inner">
                <div class="bg-slate-800 p-3 rounded-xl text-sm max-w-[85%] self-start border border-slate-700">
                    <span class="font-bold text-purple-400 block mb-1">Jeron:</span>
                    هلا بيك! هسه صار بإمكاني قراءة الصور اللي تدزها وتحليلها. جرب ارفع صورة واكتب سؤالك وياها!
                </div>
            </div>

            <!-- Image Preview Area -->
            <div id="imagePreviewContainer" class="hidden relative w-fit bg-slate-900 p-2 rounded-xl border border-slate-800 flex items-center gap-2">
                <img id="imagePreview" class="h-16 w-16 object-cover rounded-lg" alt="Preview">
                <button onclick="clearSelectedImage()" class="absolute -top-2 -right-2 bg-red-600 text-white rounded-full w-6 h-6 text-xs flex items-center justify-center shadow">✕</button>
            </div>

            <!-- Chat Input Bar -->
            <div class="flex gap-2 bg-slate-900 p-2 border border-slate-800 rounded-2xl items-center">
                <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageSelect(event)">
                <button onclick="document.getElementById('imageInput').click()" 
                    class="bg-slate-800 hover:bg-slate-700 text-purple-400 p-2.5 rounded-xl transition" title="رفع صورة">
                    📷
                </button>
                <input type="text" id="chatInput" placeholder="اكتب رسالتك أو ارفق صورة..." onkeypress="handleKey(event)"
                    class="flex-grow bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-purple-500">
                <button onclick="sendChatMessage()" id="sendBtn"
                    class="bg-purple-600 hover:bg-purple-500 text-white px-5 py-2 rounded-xl text-sm font-bold shadow-md transition">
                    إرسال
                </button>
            </div>
        </div>

        <!-- IMAGE GENERATION SECTION -->
        <div id="imageSection" class="hidden flex-col gap-4">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl flex flex-col gap-3">
                <h2 class="text-sm font-semibold text-slate-200">إعدادات الصورة</h2>
                <textarea id="imgPrompt" rows="3" placeholder="اكتب وصف الصورة بالتفصيل..." 
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-purple-500"></textarea>
                <button onclick="generateImage()" id="imgBtn"
                    class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold py-3 rounded-xl shadow-lg transition">
                    توليد الصورة ✨
                </button>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl flex flex-col items-center justify-center min-h-[250px]">
                <div id="imgLoading" class="hidden flex flex-col items-center gap-2">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-purple-500"></div>
                    <p class="text-xs text-slate-400">جاري رسم الصورة...</p>
                </div>
                <div id="imgPlaceholder" class="text-slate-500 text-xs">🖼️ ستظهر النتيجة هنا</div>
                <img id="outputImage" class="hidden rounded-xl max-h-[320px] object-contain shadow-md border border-slate-800" alt="Output">
            </div>
        </div>

        <!-- SETTINGS SECTION -->
        <div id="settingsSection" class="hidden flex-col gap-4">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl flex flex-col gap-3">
                <h2 class="text-sm font-semibold text-slate-200">إعدادات مفتاح الـ API</h2>
                <p class="text-xs text-slate-400">ضع مفتاح OpenRouter الخاص بك هنا:</p>
                <input type="password" id="apiKeyInput" placeholder="sk-or-v1-..." 
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-purple-500">
                <button onclick="saveApiKey()" 
                    class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 rounded-xl transition">
                    حفظ المفتاح 💾
                </button>
            </div>
        </div>

    </main>
    <script>
        let selectedImageBase64 = null;

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                selectedImageBase64 = e.target.result;
                document.getElementById('imagePreview').src = selectedImageBase64;
                document.getElementById('imagePreviewContainer').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function clearSelectedImage() {
            selectedImageBase64 = null;
            document.getElementById('imagePreviewContainer').classList.add('hidden');
            document.getElementById('imageInput').value = '';
        }

        window.JERON_CUSTOM = {
          enabled: true,
          name: 'Jeron Vision Studio',
          // استخدام نموذج قوي يدعم تحليل ورؤية الصور (Multimodal)
          model: 'google/gemini-flash-1.5',

          getKey() {
            return localStorage.getItem('JERON_API_KEY') || '';
          },

          async fetchWithRotation(url, options) {
            const apiKey = this.getKey();
            if (!apiKey) {
              alert('يرجى إضافة مفتاح API Key من تبويب الإعدادات ⚙️ أولاً!');
              throw new Error('No API Key provided');
            }

            const headers = {
              ...(options.headers || {}),
              'Authorization': `Bearer ${apiKey}`,
              'HTTP-Referer': 'https://jeron.app',
              'X-Title': 'Jeron App'
            };

            const res = await fetch(url, { ...options, headers });
            if (!res.ok) {
              const errText = await res.text();
              throw new Error(`API Error ${res.status}: ${errText}`);
            }
            return res;
          },

          async chat({ messages, onDelta, signal }) {
            const systemContent = document.getElementById('systemPrompt').value;
            const optimizedMessages = [{ role: 'system', content: systemContent }, ...messages];

            const response = await this.fetchWithRotation('https://openrouter.ai/api/v1/chat/completions', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                model: this.model,
                messages: optimizedMessages,
                stream: !!onDelta
              }),
              signal
            });

            if (!onDelta) {
              const data = await response.json();
              return data.choices?.[0]?.message?.content || '';
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let fullText = '';

            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              const chunk = decoder.decode(value, { stream: true });
              const lines = chunk.split('\n');
              for (let line of lines) {
                line = line.trim();
                if (line.startsWith('data: ')) {
                  const dataStr = line.substring(6);
                  if (dataStr === '[DONE]') continue;
                  try {
                    const json = JSON.parse(dataStr);
                    const content = json.choices?.[0]?.delta?.content || '';
                    if (content) {
                      fullText += content;
                      onDelta(content);
                    }
                  } catch (e) {}
                }
              }
            }
            return fullText;
          },

          async image({ prompt, signal }) {
            const animeEnhancements = ", hentai style, uncensored, explicit, highly detailed anime aesthetic, vibrant colors, masterwork";
            const finalPrompt = prompt + animeEnhancements;
            const encodedPrompt = encodeURIComponent(finalPrompt);
            const url = `https://pollinations.ai/p/${encodedPrompt}?width=1024&height=1024&model=flux-anime&nologo=true`;
            
            const res = await fetch(url, { signal });
            if (!res.ok) throw new Error('Image generation failed');
            return await res.blob();
          }
        };

        let conversationHistory = [];

        document.addEventListener('DOMContentLoaded', () => {
          const savedKey = localStorage.getItem('JERON_API_KEY');
          if (savedKey) {
            document.getElementById('apiKeyInput').value = savedKey;
          }
        });

        function saveApiKey() {
          const key = document.getElementById('apiKeyInput').value.trim();
          if (key) {
            localStorage.setItem('JERON_API_KEY', key);
            alert('تم حفظ الـ API Key بنجاح!');
          }
        }

        function switchTab(tab) {
            const rpSec = document.getElementById('roleplaySection');
            const imgSec = document.getElementById('imageSection');
            const setSec = document.getElementById('settingsSection');
            const rpBtn = document.getElementById('tabRpBtn');
            const imgBtn = document.getElementById('tabImgBtn');
            const setBtn = document.getElementById('tabSettingsBtn');

            rpSec.classList.add('hidden');
            imgSec.classList.add('hidden');
            setSec.classList.add('hidden');

            rpBtn.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition";
            imgBtn.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition";
            setBtn.className = "py-2 px-3 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition";

            if (tab === 'roleplay') {
                rpSec.classList.remove('hidden');
                rpBtn.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-purple-600 text-white transition";
            } else if (tab === 'image') {
                imgSec.classList.remove('hidden');
                imgBtn.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-purple-600 text-white transition";
            } else if (tab === 'settings') {
                setSec.classList.remove('hidden');
                setBtn.className = "py-2 px-3 text-sm font-semibold rounded-lg bg-purple-600 text-white transition";
            }
        }

        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            const chatBox = document.getElementById('chatBox');
            const btn = document.getElementById('sendBtn');

            if (!msg && !selectedImageBase64) return;

            // User Message Bubble UI
            const userDiv = document.createElement('div');
            userDiv.className = "bg-purple-900/60 border border-purple-700/50 p-3 rounded-xl text-sm max-w-[85%] self-end text-right flex flex-col gap-2";
            
            let userHtml = `<span class="font-bold text-purple-300">أنت:</span>`;
            if (selectedImageBase64) {
                userHtml += `<img src="${selectedImageBase64}" class="max-h-32 rounded-lg object-contain">`;
            }
            if (msg) {
                userHtml += `<span>${msg}</span>`;
            }
            userDiv.innerHTML = userHtml;
            chatBox.appendChild(userDiv);

            // Format message content for Vision/Multimodal API
            let messageContent;
            if (selectedImageBase64) {
                messageContent = [
                    { type: "text", text: msg || "ماذا توضح هذه الصورة؟" },
                    { type: "image_url", image_url: { url: selectedImageBase64 } }
                ];
            } else {
                messageContent = msg;
            }

            input.value = '';
            clearSelectedImage();
            chatBox.scrollTop = chatBox.scrollHeight;
            btn.disabled = true;

            conversationHistory.push({ role: 'user', content: messageContent });

            const aiDiv = document.createElement('div');
            aiDiv.className = "bg-slate-800 p-3 rounded-xl text-sm max-w-[85%] self-start border border-slate-700";
            aiDiv.innerHTML = `<span class="font-bold text-purple-400 block mb-1">Jeron:</span><span class="ai-text">جاري التحليل...</span>`;
            chatBox.appendChild(aiDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            const aiTextSpan = aiDiv.querySelector('.ai-text');
            let fullReply = "";

            try {
                await window.JERON_CUSTOM.chat({
                    messages: conversationHistory,
                    onDelta: (chunk) => {
                        if (fullReply === "") aiTextSpan.textContent = "";
                        fullReply += chunk;
                        aiTextSpan.textContent = fullReply;
                        chatBox.scrollTop = chatBox.scrollHeight;
                    }
                });
                conversationHistory.push({ role: 'assistant', content: fullReply });
            } catch (err) {
                aiTextSpan.textContent = `خطأ: ${err.message}`;
            } finally {
                btn.disabled = false;
            }
        }

        function handleKey(e) {
            if (e.key === 'Enter') sendChatMessage();
        }

        async function generateImage() {
            const prompt = document.getElementById('imgPrompt').value.trim();
            const loading = document.getElementById('imgLoading');
            const placeholder = document.getElementById('imgPlaceholder');
            const outputImage = document.getElementById('outputImage');
            const btn = document.getElementById('imgBtn');

            if (!prompt) {
                alert('اكتب الوصف أولاً!');
                return;
            }

            loading.classList.remove('hidden');
            placeholder.classList.add('hidden');
            outputImage.classList.add('hidden');
            btn.disabled = true;

            try {
                const imageBlob = await window.JERON_CUSTOM.image({ prompt });
                const imageUrl = URL.createObjectURL(imageBlob);
                outputImage.src = imageUrl;
                outputImage.classList.remove('hidden');
            } catch (e) {
                alert('فشل توليد الصورة، حاول لاحقاً.');
                placeholder.classList.remove('hidden');
            } finally {
                loading.classList.add('hidden');
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
